<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频去水印/字幕工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #00d4ff; }
        .card { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .card h2 { margin-bottom: 16px; color: #00d4ff; font-size: 18px; }
        .server-input { display: flex; gap: 10px; margin-bottom: 20px; }
        .server-input input { flex: 1; padding: 12px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; font-size: 14px; }
        .server-input input:focus { outline: none; border-color: #00d4ff; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,212,255,0.4); }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #cc3344); color: #fff; }
        .upload-area { border: 2px dashed #0f3460; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #00d4ff; background: rgba(0,212,255,0.1); }
        .upload-area.dragover { border-color: #00ff88; background: rgba(0,255,136,0.1); }
        #fileInput { display: none; }
        .video-preview { display: none; margin-top: 20px; }
        .video-preview video { max-width: 100%; border-radius: 8px; }
        .canvas-container { position: relative; margin-top: 20px; display: none; }
        .canvas-container canvas { max-width: 100%; border-radius: 8px; cursor: crosshair; }
        .regions-list { margin-top: 20px; }
        .region-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #0f3460; border-radius: 8px; margin-bottom: 8px; }
        .region-item button { padding: 4px 12px; }
        .status { padding: 12px; border-radius: 8px; margin-top: 20px; display: none; }
        .status.success { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status.error { background: rgba(255,71,87,0.2); color: #ff4757; }
        .status.info { background: rgba(0,212,255,0.2); color: #00d4ff; }
        .progress { width: 100%; height: 8px; background: #0f3460; border-radius: 4px; overflow: hidden; margin-top: 10px; display: none; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); width: 0%; transition: width 0.3s; }
        .download-link { display: none; margin-top: 20px; }
        .download-link a { color: #00d4ff; text-decoration: none; }
        .api-status { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.online { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-dot.offline { background: #ff4757; }
        .instructions { background: #0f3460; padding: 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        .instructions code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频去水印/字幕工具</h1>
        
        <div class="card">
            <h2>📡 服务器配置</h2>
            <div class="server-input">
                <input type="text" id="serverUrl" placeholder="输入API服务器地址，如：https://your-server.com" value="">
                <button class="btn btn-primary" onclick="checkServer()">连接</button>
            </div>
            <div class="api-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
            <div class="instructions">
                <strong>使用说明：</strong><br>
                1. 输入服务器地址并点击连接<br>
                2. 上传视频文件<br>
                3. 点击"AI自动检测"或手动框选水印区域<br>
                4. 点击"去除水印"处理视频<br>
                5. 下载处理后的视频
            </div>
        </div>
        
        <div class="card">
            <h2>📤 上传视频</h2>
            <div class="upload-area" id="uploadArea">
                <p>📁 点击或拖拽视频文件到这里</p>
                <p style="font-size: 12px; color: #888; margin-top: 10px;">支持 MP4, MOV, AVI 格式</p>
            </div>
            <input type="file" id="fileInput" accept="video/*">
            <div class="video-preview" id="videoPreview">
                <video id="previewVideo" controls></video>
            </div>
            <div class="status" id="uploadStatus"></div>
        </div>
        
        <div class="card">
            <h2>🎯 选择水印区域</h2>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="drawCanvas"></canvas>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="autoDetect()">🔍 AI自动检测</button>
                <button class="btn btn-primary" onclick="addManualRegion()">➕ 手动添加区域</button>
                <button class="btn btn-danger" onclick="clearRegions()">🗑️ 清除所有区域</button>
            </div>
            <div class="regions-list" id="regionsList"></div>
        </div>
        
        <div class="card">
            <h2>⚙️ 处理视频</h2>
            <button class="btn btn-success" id="processBtn" onclick="processVideo()">🎬 去除水印</button>
            <div class="progress" id="progressBar">
                <div class="progress-bar" id="progressFill"></div>
            </div>
            <div class="status" id="processStatus"></div>
            <div class="download-link" id="downloadLink"></div>
        </div>
    </div>

    <script>
        let serverUrl = '';
        let taskId = null;
        let videoPath = null;
        let regions = [];
        let isDrawing = false;
        let startX, startY;
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        
        // 默认服务器地址
        document.getElementById('serverUrl').value = localStorage.getItem('watermarkServer') || '';
        
        function checkServer() {
            serverUrl = document.getElementById('serverUrl').value.replace(/\/$/, '');
            localStorage.setItem('watermarkServer', serverUrl);
            
            showStatus('statusText', '连接中...', 'info');
            
            fetch(`${serverUrl}/health`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('statusDot').className = 'status-dot online';
                    document.getElementById('statusText').textContent = `已连接 - ${data.service || 'OK'}`;
                })
                .catch(err => {
                    document.getElementById('statusDot').className = 'status-dot offline';
                    document.getElementById('statusText').textContent = '连接失败';
                    console.error(err);
                });
        }
        
        // 自动检测服务器
        if (document.getElementById('serverUrl').value) {
            checkServer();
        }
        
        // 文件上传
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.onclick = () => fileInput.click();
        uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); };
        uploadArea.ondragleave = () => uploadArea.classList.remove('dragover');
        uploadArea.ondragdrop = (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
        fileInput.onchange = (e) => handleFiles(e.target.files);
        
        function handleFiles(files) {
            if (!files.length || !serverUrl) {
                if (!serverUrl) showStatus('uploadStatus', '请先连接服务器', 'error');
                return;
            }
            
            const file = files[0];
            showStatus('uploadStatus', `正在上传 ${file.name}...`, 'info');
            
            const formData = new FormData();
            formData.append('video', file);
            
            fetch(`${serverUrl}/upload`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    taskId = data.task_id;
                    videoPath = data.video_path;
                    showStatus('uploadStatus', `上传成功！视频信息: ${data.video_info?.width}x${data.video_info?.height}, 时长: ${data.video_info?.duration?.toFixed(1)}s`, 'success');
                    
                    // 显示预览
                    const preview = document.getElementById('videoPreview');
                    const video = document.getElementById('previewVideo');
                    video.src = URL.createObjectURL(file);
                    preview.style.display = 'block';
                    
                    // 设置画布
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        document.getElementById('canvasContainer').style.display = 'block';
                        drawFrame();
                    };
                })
                .catch(err => showStatus('uploadStatus', `上传失败: ${err.message}`, 'error'));
        }
        
        function drawFrame() {
            const video = document.getElementById('previewVideo');
            ctx.drawImage(video, 0, 0);
            drawRegions();
        }
        
        function drawRegions() {
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            regions.forEach((r, i) => {
                ctx.strokeRect(r.x, r.y, r.width, r.height);
                ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
                ctx.fillRect(r.x, r.y, r.width, r.height);
                ctx.fillStyle = '#fff';
                ctx.font = '14px sans-serif';
                ctx.fillText(`区域 ${i + 1}`, r.x + 5, r.y + 20);
            });
        }
        
        // 画布交互
        canvas.onmousedown = (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            isDrawing = true;
        };
        
        canvas.onmousemove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;
            
            drawFrame();
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        };
        
        canvas.onmouseup = (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const endX = (e.clientX - rect.left) * scaleX;
            const endY = (e.clientY - rect.top) * scaleY;
            
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);
            
            if (width > 10 && height > 10) {
                regions.push({
                    x: Math.min(startX, endX),
                    y: Math.min(startY, endY),
                    width: width,
                    height: height
                });
                updateRegionsList();
                drawFrame();
            }
        };
        
        function autoDetect() {
            if (!taskId) {
                showStatus('processStatus', '请先上传视频', 'error');
                return;
            }
            
            showStatus('processStatus', 'AI正在检测水印区域...', 'info');
            
            fetch(`${serverUrl}/detect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: taskId })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                regions = data.regions || [];
                updateRegionsList();
                drawFrame();
                showStatus('processStatus', `检测完成，找到 ${regions.length} 个区域`, 'success');
            })
            .catch(err => showStatus('processStatus', `检测失败: ${err.message}`, 'error'));
        }
        
        function addManualRegion() {
            // 添加一个默认区域
            regions.push({ x: 10, y: 10, width: 200, height: 50 });
            updateRegionsList();
            drawFrame();
        }
        
        function clearRegions() {
            regions = [];
            updateRegionsList();
            drawFrame();
        }
        
        function updateRegionsList() {
            const list = document.getElementById('regionsList');
            list.innerHTML = regions.map((r, i) => `
                <div class="region-item">
                    <span>区域 ${i + 1}: (${r.x}, ${r.y}) ${r.width}×${r.height}</span>
                    <button class="btn btn-danger" onclick="removeRegion(${i})">删除</button>
                </div>
            `).join('');
        }
        
        function removeRegion(index) {
            regions.splice(index, 1);
            updateRegionsList();
            drawFrame();
        }
        
        function processVideo() {
            if (!taskId) {
                showStatus('processStatus', '请先上传视频', 'error');
                return;
            }
            if (regions.length === 0) {
                showStatus('processStatus', '请先选择水印区域', 'error');
                return;
            }
            
            showStatus('processStatus', '正在处理视频...', 'info');
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressFill').style.width = '30%';
            
            fetch(`${serverUrl}/remove`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: taskId, regions: regions })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                document.getElementById('progressFill').style.width = '100%';
                showStatus('processStatus', '处理完成！', 'success');
                
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.innerHTML = `<a href="${serverUrl}${data.download_url}" target="_blank">📥 下载处理后的视频</a>`;
                downloadLink.style.display = 'block';
            })
            .catch(err => {
                document.getElementById('progressFill').style.width = '0%';
                showStatus('processStatus', `处理失败: ${err.message}`, 'error');
            });
        }
        
        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status ${type}`;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
